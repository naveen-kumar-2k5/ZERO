<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZeroRespond — Detection Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/zerorespond.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/alerts.css') }}">
</head>
<body>
{% set active_page = 'alerts' %}
{% include 'sidebar.html' %}
<!-- ══════ TOPBAR ══════ -->
<header id="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="topbar-brand">Zero<span>Respond</span></div>
    <span class="page-title">Detection Feed</span>
  </div>
  <div class="topbar-right">
    <span id="live-time">--:--:-- IST</span>
    <div class="user-av">IT</div>
  </div>
</header>

<!-- ══════ CONTENT ══════ -->
<main id="content">
  <div class="feed-wrap">

    <div class="page-hd">
      <h1>Detection Feed</h1>
      <p>Alerts received from Wazuh and stored in PostgreSQL. Newest first.</p>
    </div>

    <div class="al-filters">
      <!-- Time range preset -->
      <select class="fselect" id="f-range" onchange="onRangeChange()" title="Time range">
        <option value="today" selected>Today</option>
        <option value="24h">Last 24 hours</option>
        <option value="12h">Last 12 hours</option>
        <option value="3d">Last 3 days</option>
        <option value="7d">Last 7 days</option>
        <option value="15d">Last 15 days</option>
        <option value="30d">Last month</option>
        <option value="90d">Last 3 months</option>
        <option value="custom">Custom range…</option>
      </select>

      <select class="fselect" id="f-sev" onchange="loadFeed()">
        <option value="">All urgency levels</option>
        <option value="critical">Urgent only</option>
        <option value="high">High only</option>
        <option value="medium">Medium only</option>
        <option value="low">Low only</option>
      </select>

      <select class="fselect" id="f-cat" onchange="loadFeed()">
        <option value="">All attack types</option>
        <option value="bf">Brute Force</option>
        <option value="pe">Privilege Escalation</option>
        <option value="fim">File Integrity</option>
        <option value="ra">Ransomware</option>
      </select>

      <input class="finput" type="text" placeholder="Search alerts..." id="f-search" oninput="debouncedLoad()">

      <button class="btn btn-secondary btn-sm" id="refresh-btn" onclick="loadFeed()">
        <i data-lucide="refresh-cw" class="ui-icon"></i> Refresh
      </button>

      <span class="status-pill loading" id="feed-status">
        <span class="dot"></span>Loading
      </span>
    </div>

    <!-- Custom date range panel (hidden unless "custom" picked) -->
    <div class="range-panel" id="custom-range-panel" style="display:none">
      <div class="range-panel-row">
        <label class="range-lbl" for="f-from">From</label>
        <input type="datetime-local" class="finput" id="f-from">
        <label class="range-lbl" for="f-to">To</label>
        <input type="datetime-local" class="finput" id="f-to">
        <button class="btn btn-primary btn-sm" onclick="applyCustomRange()">
          <i data-lucide="check" class="ui-icon"></i> Apply
        </button>
        <button class="btn btn-secondary btn-sm" onclick="resetRange()">
          <i data-lucide="rotate-ccw" class="ui-icon"></i> Reset
        </button>
      </div>
    </div>

    <!-- Active range summary -->
    <div class="range-active" id="range-summary"></div>

    <div class="alert-feed" id="alert-feed">
      <div style="padding:48px;text-align:center;color:var(--text-3)">
        <span class="spin"></span>Loading alerts…
      </div>
    </div>
  </div>
</main>

<script src="{{url_for('static',filename='js/alerts.js')}}"></script>
</body>
</html>
