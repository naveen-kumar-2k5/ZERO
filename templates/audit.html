<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZeroRespond — Audit Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/zerorespond.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">

  <style>
    /* ── Audit rows ──────────────────────────────────── */
    .audit-row{
      display:grid;
      grid-template-columns:150px 170px 1fr 140px;
      gap:12px;align-items:center;
      padding:11px 14px;border-bottom:1px solid var(--border);
      font-size:12.5px;
    }
    .audit-row:last-child{border-bottom:none}
    .audit-row:hover{background:var(--accent-light)}
    .audit-time{
      font-family:var(--font-brand);color:var(--text-3);
      font-size:12px;white-space:nowrap;
    }
    .audit-action{font-weight:700;color:var(--text-1)}
    .audit-detail{
      color:var(--text-2);font-size:13px;
      overflow:hidden;text-overflow:ellipsis;
    }
    .audit-detail strong{color:var(--text-1);font-family:var(--font-code);font-weight:600}
    .audit-actor{
      justify-self:start;
      font-size:11px;font-weight:700;
      padding:2px 8px;border-radius:10px;
      background:var(--bg-base);color:var(--text-2);
      border:1px solid var(--border);
      white-space:nowrap;
    }
    .audit-actor.system{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
    .audit-actor.wazuh{background:#fef3c7;color:#92400e;border-color:#fde68a}

    /* ── Toolbar ────────────────────────────────────── */
    .audit-toolbar{
      display:flex;align-items:center;gap:10px;
      flex-wrap:wrap;margin-bottom:14px;
    }
    .audit-toolbar .finput{min-width:220px}

    /* ── Report History table ───────────────────────── */
    .report-history-row{
      display:grid;
      grid-template-columns:170px 100px 1fr 180px 130px;
      gap:12px;align-items:center;
      padding:12px 16px;border-bottom:1px solid var(--border);
      font-size:12.5px;
    }
    .report-history-row:last-child{border-bottom:none}
    .report-history-row strong{font-family:var(--font-brand);color:var(--text-1)}

    /* ── Responsive ─────────────────────────────────── */
    @media(max-width:800px){
      .audit-row{grid-template-columns:1fr 1fr;gap:4px}
      .audit-detail{grid-column:1/-1;white-space:normal}
      .report-history-row{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
{% set active_page = 'audit' %}
{% include 'sidebar.html' %}
<header id="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="topbar-brand">Zero<span>Respond</span></div>
    <span class="page-title">Audit Log</span>
  </div>
  <div class="topbar-right">
    <span id="live-time">--:--:-- IST</span>
    <div class="user-av">IT</div>
  </div>
</header>

<main id="content">

  <div class="page-hd">
    <h1>Audit Log</h1>
    <p>Recorded actions across incident cases, evidence, response steps, and reporting.</p>
  </div>

  <div class="card">
    <div class="card-hd">
      <span class="card-title"><i data-lucide="scroll-text" class="ui-icon"></i> Recent Activity</span>
      <span style="font-size:12.5px;color:var(--text-3)" id="audit-count">—</span>
    </div>

    <div class="audit-toolbar">
      <input class="finput" type="text" id="audit-search" placeholder="Search actions, refs, details…" oninput="debouncedLoad()">
      <select class="fselect" id="audit-filter-actor" onchange="loadAudit()">
        <option value="">All users</option>
        <option value="System">System</option>
        <option value="IT Team">IT Team</option>
        <option value="Naveen Kumar">Naveen Kumar</option>
        <option value="Ragul">Ragul</option>
        <option value="Manikandan">Manikandan</option>
        <option value="Prithiv Raj">Prithiv Raj</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="loadAudit()">
        <i data-lucide="refresh-cw" class="ui-icon"></i> Refresh
      </button>
      <button class="btn btn-secondary btn-sm" onclick="exportAuditCsv()">
        <i data-lucide="download" class="ui-icon"></i> Export CSV
      </button>
    </div>

    <div id="audit-list">
      <div style="padding:32px;text-align:center;color:var(--text-3)">
        <span class="spin"></span>Loading audit log…
      </div>
    </div>
  </div>

  <!-- ══════ Report History ══════ -->
  <div class="card" style="margin-top:20px;padding:0;overflow:hidden">
    <div class="card-hd" style="padding:20px 20px 0;margin-bottom:8px">
      <span class="card-title"><i data-lucide="file-text" class="ui-icon"></i> Report History</span>
      <a class="btn btn-ghost btn-sm" href="/report">
        <i data-lucide="plus" class="ui-icon"></i> Generate new
      </a>
    </div>
    <div id="report-history-list">
      <div style="padding:24px;text-align:center;color:var(--text-3)">
        <span class="spin"></span>Loading reports…
      </div>
    </div>
  </div>

</main>

<script src="{{url_for('static',filename='js/audit.js')}}"></script>
</body>
</html>
