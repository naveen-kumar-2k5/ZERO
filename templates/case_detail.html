<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZeroRespond — Case Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/zerorespond.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/incidents.css') }}">

  <style>
    /* ── Mode toggle ── */
    .zr-mode-sel {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }
    .zr-mode-sel select {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 5px;
      border: 1px solid var(--border-2);
      background: #fff;
      font-family: var(--font-ui);
      cursor: pointer;
    }

    /* ── Terminal pane ── */
    .zr-term {
      border-radius: 6px;
      overflow: hidden;
      background: #1e1e1e;
      border: 1px solid #2b2b2b;
      margin-top: 10px;
      font-family: var(--font-code);
    }
    .zr-term-hd {
      background: #252526;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: #d4d4d4;
    }
    .zr-term-hd .prompt {
      color: #4ade80;
      font-weight: 600;
      flex-shrink: 0;
    }
    .zr-term-hd .argv {
      color: #9cdcfe;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .zr-conn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #9ca3af;
      flex-shrink: 0;
    }
    .zr-conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .zr-conn-dot.online  { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.7); }
    .zr-conn-dot.offline { background: #ef4444; }
    .zr-conn-dot.unknown { background: #94a3b8; }

    .zr-term-body {
      padding: 10px 12px;
      font-size: 12px;
      color: #d4d4d4;
      background: #1e1e1e;
      max-height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 60px;
      line-height: 1.45;
    }
    .zr-term-body:empty::before {
      content: attr(data-empty);
      color: #6b7280;
      font-style: italic;
    }

    .zr-term-foot {
      padding: 6px 12px;
      border-top: 1px solid #333;
      background: #252526;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .zr-term-foot .ok    { color: #4ade80; }
    .zr-term-foot .fail  { color: #ef4444; }
    .zr-term-foot .spin-sm {
      display: inline-block;
      width: 10px; height: 10px;
      border: 1.5px solid #444;
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -1px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .zr-term-guard {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12.5px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .zr-term-guard.ok {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #86efac;
    }
    .zr-term-guard.fail {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .zr-term-guard .ui-icon { width: 14px; height: 14px; flex-shrink: 0; }

    .zr-term-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .zr-term-actions .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Done + Undo sit in one row on narrow screens */
    .zr-step-footer {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>

{% set active_page = 'incidents' %}
{% include 'sidebar.html' %}
<header id="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="topbar-brand">Zero<span>Respond</span></div>
    <span class="page-title">Case Detail</span>
  </div>
  <div class="topbar-right">
    <span id="live-time">--:--:-- IST</span>
    <div class="user-av">IT</div>
  </div>
</header>

<main id="content">
  <div id="case-root">
    <div style="padding:64px 20px;text-align:center;color:var(--text-3)">
      <span class="spin"></span>Loading case…
    </div>
  </div>
</main>

<!-- Evidence modal -->
<div id="evidence-modal" class="modal-overlay" style="display:none"
     onclick="if (event.target === this) closeEvidenceModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hd">
      <span class="modal-title"><i data-lucide="paperclip" class="ui-icon"></i> Add Evidence</span>
      <button class="modal-close" onclick="closeEvidenceModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="info-banner" style="margin-bottom:14px">
        <i data-lucide="info" class="ui-icon"></i>
        Demo mode: only the filename is stored in the case record — no file bytes are uploaded.
      </div>
      <div class="form-group">
        <label class="form-label">Filename *</label>
        <input class="form-input" id="ev-filename" placeholder="e.g. screenshot_desktop.png">
      </div>
      <div class="form-group">
        <label class="form-label">Evidence type</label>
        <select class="form-select" id="ev-kind">
          <option>Screenshot</option>
          <option>Log File</option>
          <option>Network Capture</option>
          <option>Memory Dump</option>
          <option>Document / Report</option>
          <option selected>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-textarea" id="ev-notes" placeholder="What does this file show?"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEvidenceModal()">Cancel</button>
      <button class="btn btn-primary" onclick="attachEvidence()">
        <i data-lucide="paperclip" class="ui-icon"></i> Attach to Case
      </button>
    </div>
  </div>
</div>

<script>
  const CASE_ID = {{ case_id | tojson }};
</script>
<script src="{{ url_for('static', filename='js/case.js') }}"></script>
</body>
</html>
