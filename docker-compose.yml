# Compose v2 — `version:` is obsolete and omitted on purpose.

services:
  # ── 1. PostgreSQL ────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zerorespond-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These three override .env so the container config wins on identity,
      # but the password comes from .env — no secret in this file.
      POSTGRES_DB:       ${PG_DB:-zerorespong_db}
      POSTGRES_USER:     ${PG_USER:-zero}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      TZ:                Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-zero} -d ${PG_DB:-zerorespong_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 2. Webhook receiver (port 5000) ──────────────────
  webhook:
    build: .
    container_name: zerorespond-webhook
    command: python webhook.py
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # ── 3. Main UI (port 5001) ───────────────────────────
  app:
    build: .
    container_name: zerorespond-app
    command: python app.py
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      # Container networking overrides — these replace the localhost
      # defaults from .env because inside Compose the DB is "db", not localhost.
      - PG_HOST=db
      - PG_DB=${PG_DB:-zerorespong_db}
      - PG_USER=${PG_USER:-zero}
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      - WEBHOOK_URL=http://webhook:5000
      - UI_URL=http://app:5001
      # WAZUH_* are inherited from .env via env_file:
    depends_on:
      db:
        condition: service_healthy
      webhook:
        condition: service_started
    restart: unless-stopped

  # ── 4. Poller (webhook → postgres) ───────────────────
  poller:
    build: .
    container_name: zerorespond-poller
    command: python main.py
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PG_HOST=db
      - PG_DB=${PG_DB:-zerorespong_db}
      - PG_USER=${PG_USER:-zero}
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      - API_URL=http://webhook:5000/api/v1/alerts
    depends_on:
      db:
        condition: service_healthy
      webhook:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: